name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    name: "Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}${{ matrix.lint && ' (lint)' || '' }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Every row pins the latest patch of its Elixir minor and its OTP
          # major, verified against the release tags. Bump every row that
          # uses a version in the same change, never one at a time.

          # Elixir 1.17 — supports OTP 25–27
          - elixir: "1.17.3-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.17.3-otp-27"
            otp: "27.3.4.19"

          # Elixir 1.18 — supports OTP 25–27
          - elixir: "1.18.6-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.18.6-otp-27"
            otp: "27.3.4.19"

          # Elixir 1.19 — supports OTP 26–28
          - elixir: "1.19.7-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.19.7-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.19.7-otp-28"
            otp: "28.5.0.8"

          # Elixir 1.20 — supports OTP 27–29
          - elixir: "1.20.5-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.20.5-otp-28"
            otp: "28.5.0.8"
          - elixir: "1.20.5-otp-29"
            otp: "29.1.2"
            lint: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Compiled BEAMs are tied to the Elixir and OTP versions, so the key
      # and every restore key carry both.
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Restore PLT cache
        if: matrix.lint
        uses: actions/cache@v6
        with:
          path: _build/test/dialyxir_*
          key: plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      # Dialyzer runs under the workflow's MIX_ENV=test, not dev: the dev
      # env compiles the data-regeneration helpers under mix/support
      # (iso_currency.ex and others), which read $CLDR_PRODUCTION and the
      # CLDR source files at compile time and so cannot compile in CI.
      - name: Run dialyzer
        if: matrix.lint
        run: mix dialyzer

      - name: Check docs
        if: matrix.lint
        env:
          MIX_ENV: release
        run: mix docs --warnings-as-errors
